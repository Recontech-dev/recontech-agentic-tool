name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The tests only read the code.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the run for the older one pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      # One system failing should not hide whether the others pass.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A test stuck on a child process would otherwise hold the runner for GitHub's default of 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-secrets.mjs --all
