name: Release

# Pushing a tag such as v0.2.0 runs the tests, builds AgenticLazyTool.exe and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pytest pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python packaging/build_exe.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/AgenticLazyTool.exe --title "${{ github.ref_name }}" --generate-notes
