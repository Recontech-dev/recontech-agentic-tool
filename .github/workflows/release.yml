name: Release

# Pushing a tag such as v0.3.0 runs the tests, builds the Windows installer and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp release/RecontechAgenticTool-Setup-*.exe RecontechAgenticTool-Setup.exe
          gh release create "${{ github.ref_name }}" RecontechAgenticTool-Setup.exe --title "${{ github.ref_name }}" --generate-notes
