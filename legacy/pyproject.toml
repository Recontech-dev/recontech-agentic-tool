[project]
name = "agentic-lazy-tool"
version = "0.1.0"
description = "Chat terminal with multiple Claude API profiles and automatic fallback to free AI providers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.60",
    "openai>=1.50",
    "rich>=13",
    "prompt_toolkit>=3.0",
    "keyring>=24",
]

[project.scripts]
agentic-lazy-tool = "agentic_lazy_tool.cli:main"
alt = "agentic_lazy_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_lazy_tool"]
